name: Heartbeat (keep scheduled Actions enabled)
run-name: Heartbeat (${{ github.ref_name }})

# This workflow exists to solve two overlapping problems with GitHub
# scheduled workflows on this fork:
#
# 1. GitHub automatically disables `schedule`-triggered workflows on public
#    repos after 60 days with no repository push activity. "4. Build Loop"'s
#    own weekly sync only produces a push when upstream LoopKit/LoopWorkspace
#    has new commits, so a quiet upstream period can leave this fork's
#    schedule silently disabled with no notice.
# 2. Separately, build_loop.yml has been observed flipping back to disabled
#    within roughly 10-20 minutes of being re-enabled -- including via a
#    scripted API call with no human involved -- which doesn't match the
#    60-day policy at all and looks like a GitHub-side quirk/bug. There's no
#    way to fully prevent this from inside the repo, so this workflow also
#    re-enables build_loop.yml a few minutes before its real weekly trigger
#    time, so it only has to stay enabled for minutes, not a full week, to
#    make that run.
#
# This file is fork-local: it is not present upstream, so future syncs from
# LoopKit/LoopWorkspace merge in cleanly around it with no conflicts and no
# maintenance required. It never touches upstream, and it never commits to
# main/dev (so it never affects the build-tracking git revision) — its own
# commits go only to a dedicated `heartbeat` branch in this fork.

on:
  workflow_dispatch:
  schedule:
    # Weekly, well inside GitHub's 60-day inactivity window, and frequent
    # enough to self-heal quickly if a workflow gets disabled for any reason.
    - cron: "17 9 * * 3"
    # Pre-flight: fires 5 minutes before build_loop.yml's own "33 7 * * 0"
    # schedule. In practice this fork has seen build_loop.yml flip back to
    # disabled within ~10-20 minutes of being re-enabled, for reasons that
    # don't match GitHub's documented 60-day inactivity policy (it has
    # recurred even immediately after a scripted API re-enable with no
    # human involved). Re-enabling it right before its real trigger time
    # means it only needs to survive a few minutes, not a full week, to
    # make that Sunday run.
    - cron: "28 7 * * 0"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # Real push activity resets GitHub's 60-day inactivity clock for the
      # whole repository (all workflows), not just this one.
      - name: Push a heartbeat commit to a dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin heartbeat || true
          if git show-ref --verify --quiet refs/remotes/origin/heartbeat; then
            git checkout heartbeat
          else
            git checkout --orphan heartbeat
            git rm -rf . > /dev/null
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)" --allow-empty
          git push origin heartbeat

      # Belt-and-suspenders: directly check whether the workflows this fork
      # depends on have been disabled (for any reason) and re-enable them,
      # rather than only relying on activity to prevent it in the first place.
      - name: Re-enable any disabled scheduled workflows
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for wf in build_loop.yml heartbeat.yml; do
            state=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf" --jq .state 2>/dev/null || echo "unknown")
            echo "$wf state: $state"
            if [ "$state" != "active" ] && [ "$state" != "unknown" ]; then
              echo "Re-enabling $wf (was: $state)"
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            fi
          done
