name: Heartbeat (keep scheduled Actions enabled)
run-name: Heartbeat (${{ github.ref_name }})

# This workflow exists because "4. Build Loop" (build_loop.yml) has been
# found disabled with no Loop build having actually run, and a previous
# version of this workflow (which only re-enabled build_loop.yml on a
# schedule) did not fix that. Investigation of this fork's Actions history
# turned up two distinct problems, not one:
#
# 1. build_loop.yml's *state* keeps flipping to `disabled_manually`. That
#    state is only set by an explicit disable (the Actions UI, or an API
#    call by something holding `actions: write`) -- GitHub's 60-day
#    inactivity auto-disable sets `disabled_inactivity` instead, a
#    different value. The actual actor behind this is still unidentified,
#    so rather than trying to prevent it, this workflow assumes it will
#    keep happening and just re-enables build_loop.yml before every use.
#
# 2. Even when build_loop.yml *is* enabled and its own "33 7 * * 0" cron
#    fires on time, GitHub's scheduled-workflow queue on public repos is
#    best-effort and has been observed running 4-6 hours late here -- so a
#    prior "re-enable 5 minutes before" pre-flight trick only worked once,
#    by coincidence, because both crons happened to drift by a similar
#    amount. More importantly, build_loop.yml's `build` job only actually
#    builds on the 2nd Sunday of the month or when upstream has new
#    commits (see build_loop.yml's `if:` conditions) -- an on-time,
#    enabled, successful *run* on any other Sunday still skips the build
#    entirely. That happened here: run fired, "succeeded", built nothing.
#
# So instead of waiting on build_loop.yml's own schedule, this workflow
# re-enables build_loop.yml and then directly `workflow_dispatch`es it
# when a real build is due (see the "Decide whether a build is due" step
# below). A workflow_dispatch satisfies the first clause of build_loop's
# `if:` unconditionally, so it always produces a real build regardless of
# what day it is or whether upstream has changes. build_loop.yml then only
# needs to stay enabled for the few seconds it takes to accept the
# dispatch, not survive a whole week un-disabled.
#
# This file is fork-local: it is not present upstream, so future syncs from
# LoopKit/LoopWorkspace merge in cleanly around it with no conflicts and no
# maintenance required. It never touches upstream, and it never commits to
# main/dev (so it never affects the build-tracking git revision) -- its own
# heartbeat commits go only to a dedicated `heartbeat` branch in this fork.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Dispatch a Loop build now, ignoring the interval/upstream check"
        type: boolean
        default: false
  schedule:
    # Daily. Cheap (~10s on a free ubuntu runner) and keeps the self-heal
    # window for a manual disable down to at most a day, instead of a week.
    - cron: "41 9 * * *"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      # Real push activity resets GitHub's 60-day inactivity clock for the
      # whole repository (all workflows), not just this one.
      - name: Push a heartbeat commit to a dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin heartbeat || true
          if git show-ref --verify --quiet refs/remotes/origin/heartbeat; then
            git checkout heartbeat
          else
            git checkout --orphan heartbeat
            git rm -rf . > /dev/null
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "chore: heartbeat $(date -u +%Y-%m-%d)" --allow-empty
          git push origin heartbeat

      # Belt-and-suspenders: directly check whether the workflows this fork
      # depends on have been disabled (for any reason) and re-enable them,
      # rather than only relying on activity to prevent it in the first place.
      - name: Re-enable any disabled workflows
        id: reenable
        run: |
          echo "### Heartbeat report ($(date -u +%Y-%m-%dT%H:%M:%SZ))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| workflow | state before | action | state after |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          build_loop_active=false

          for wf in build_loop.yml heartbeat.yml create_certs.yml validate_secrets.yml; do
            state=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf" --jq .state 2>/dev/null || echo "unknown")
            action="none"
            after="$state"

            if [ "$state" != "active" ] && [ "$state" != "unknown" ]; then
              echo "Re-enabling $wf (was: $state)"
              if gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"; then
                action="re-enabled"
                after=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf" --jq .state 2>/dev/null || echo "unknown")
              else
                action="re-enable FAILED"
              fi
            fi

            echo "$wf: $state -> $after ($action)"
            echo "| $wf | $state | $action | $after |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$wf" = "build_loop.yml" ] && [ "$after" = "active" ]; then
              build_loop_active=true
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "build_loop_active=$build_loop_active" >> "$GITHUB_OUTPUT"

      # Ground truth on "was there a real build recently" has to come from
      # the Actions API, not a stored marker: a build_loop.yml *run* can
      # report success while its Build job was skipped (exactly what
      # happens on every non-2nd-Sunday with no upstream changes). So walk
      # recent runs looking for one whose "Build" job actually succeeded.
      - name: Decide whether a build is due
        id: decide
        run: |
          should_build=false
          reason=""

          if [ "${{ inputs.force_build }}" = "true" ]; then
            should_build=true
            reason="forced via workflow_dispatch input"
          else
            last_build_days="unknown"
            run_ids=$(gh api "repos/${{ github.repository }}/actions/workflows/build_loop.yml/runs?per_page=10&status=completed" --jq '.workflow_runs[].id')
            now_epoch=$(date -u +%s)
            found=false

            for run_id in $run_ids; do
              built=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" --jq '[.jobs[] | select(.name == "Build" and .conclusion == "success")] | length')
              if [ "$built" -gt 0 ]; then
                run_created=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq .created_at)
                created_epoch=$(date -u -d "$run_created" +%s)
                last_build_days=$(( (now_epoch - created_epoch) / 86400 ))
                found=true
                break
              fi
            done

            ahead_by=$(gh api "repos/${{ github.repository }}/compare/main...LoopKit:LoopWorkspace:main" --jq .ahead_by 2>/dev/null || echo "unknown")

            if [ "$found" = "false" ] || { [ "$last_build_days" != "unknown" ] && [ "$last_build_days" -ge 28 ]; }; then
              should_build=true
              reason="no successful build in >=28 days (last: ${last_build_days} days ago)"
            elif [ "$ahead_by" != "unknown" ] && [ "$ahead_by" -gt 0 ]; then
              should_build=true
              reason="upstream is $ahead_by commit(s) ahead"
            else
              reason="last build ${last_build_days} days ago, upstream ahead_by=$ahead_by"
            fi
          fi

          echo "should_build=$should_build ($reason)"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          {
            echo "**Build decision:** should_build=$should_build"
            echo ""
            echo "$reason"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch a Loop build
        if: steps.decide.outputs.should_build == 'true' && steps.reenable.outputs.build_loop_active == 'true'
        run: |
          before=$(gh api "repos/${{ github.repository }}/actions/workflows/build_loop.yml/runs?per_page=1" --jq '.workflow_runs[0].id // 0')

          gh workflow run build_loop.yml --ref main

          dispatched=false
          for i in 1 2 3 4 5 6; do
            sleep 10
            latest=$(gh api "repos/${{ github.repository }}/actions/workflows/build_loop.yml/runs?per_page=1&event=workflow_dispatch" --jq '.workflow_runs[0].id // 0')
            if [ "$latest" != "0" ] && [ "$latest" != "$before" ]; then
              dispatched=true
              echo "Dispatched build_loop.yml run: https://github.com/${{ github.repository }}/actions/runs/$latest"
              echo "Dispatched build: https://github.com/${{ github.repository }}/actions/runs/$latest" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done

          if [ "$dispatched" = "false" ]; then
            echo "::error::workflow_dispatch of build_loop.yml did not produce a new run within 60s"
            echo "**Dispatch FAILED** -- no new build_loop.yml run appeared." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Report build not dispatched
        if: steps.decide.outputs.should_build == 'true' && steps.reenable.outputs.build_loop_active != 'true'
        run: |
          echo "::error::A build is due but build_loop.yml could not be confirmed active; skipping dispatch"
          echo "**Dispatch skipped** -- build_loop.yml was not confirmed active after re-enable." >> "$GITHUB_STEP_SUMMARY"
          exit 1
